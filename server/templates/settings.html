{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card bg-dark border-secondary mb-3">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">清理</h3>
                <form action="{{ url_for('clean_cache') }}" method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-2 form-check">
                        <input type="checkbox" name="clean_cache_files" value="1" class="form-check-input" checked id="cc1">
                        <label class="form-check-label" for="cc1">Python 缓存（__pycache__、.pyc）</label>
                    </div>
                    <div class="mb-2 form-check">
                        <input type="checkbox" name="clean_error_logs" value="1" class="form-check-input" checked id="cc2">
                        <label class="form-check-label" for="cc2">超过 3 天的错误日志</label>
                    </div>
                    <div class="mb-2 form-check">
                        <input type="checkbox" name="clean_old_tasks" value="1" class="form-check-input" checked id="cc3">
                        <label class="form-check-label" for="cc3">超过 7 天的已完成/失败任务（含结果文件）</label>
                    </div>
                    <div class="mb-2 form-check">
                        <input type="checkbox" name="clean_all_tasks" value="1" class="form-check-input" id="cc4">
                        <label class="form-check-label" for="cc4">所有已完成/失败推理任务（含结果文件）</label>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="clean_train_data" value="1" class="form-check-input" id="cc5">
                        <label class="form-check-label text-danger" for="cc5">⚠ 训练缓存+失败任务（数据集zip、解压产物、历史训练记录）</label>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">执行清理</button>
                </form>
            </div>
        </div>
        <div class="card bg-dark border-secondary mb-3">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">精确清理（单个任务/模型/数据集）</h3>
                <p class="text-secondary small">会检查是否被排队/运行中的任务引用，命中则自动拦截并提示。</p>

                <label class="form-label text-light">训练任务</label>
                <form method="POST" action="{{ url_for('clean_specific') }}" class="mb-3">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="target_type" value="train_task">
                    <select name="target_id" class="form-select bg-dark text-light border-secondary mb-2">
                        <option value="">— 选择任务 —</option>
                        {% for t in train_tasks %}
                        <option value="{{ t.id }}">#{{ t.id }} {{ t.speaker }} ({{ t.status }})</option>
                        {% endfor %}
                    </select>
                    <div class="d-flex gap-2 flex-wrap">
                        <button type="submit" name="action" value="data_dir" class="btn btn-outline-warning btn-sm" onclick="return confirm('清理后该任务将无法续训，确定？')">清理数据目录</button>
                        <button type="submit" name="action" value="zip" class="btn btn-outline-warning btn-sm" onclick="return confirm('删除该任务的数据集 zip？')">清理数据集zip</button>
                        <button type="submit" name="action" value="model_files" class="btn btn-outline-warning btn-sm" onclick="return confirm('删除该任务保存的模型/配置文件？')">清理模型文件</button>
                        <button type="submit" name="action" value="all" class="btn btn-outline-danger btn-sm" onclick="return confirm('全部清理（数据目录+zip+模型文件）？')">全部清理</button>
                    </div>
                </form>

                <label class="form-label text-light">模型</label>
                <form method="POST" action="{{ url_for('clean_specific') }}" class="mb-3">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="target_type" value="model">
                    <select name="target_id" class="form-select bg-dark text-light border-secondary mb-2">
                        <option value="">— 选择模型 —</option>
                        {% for m in models %}
                        <option value="{{ m.id }}">{{ m.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" name="action" value="delete" class="btn btn-outline-danger btn-sm" onclick="return confirm('删除该模型（含文件与关联推理配置）？')">删除模型</button>
                </form>

                <label class="form-label text-light">数据集 zip</label>
                <form method="POST" action="{{ url_for('clean_specific') }}">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="target_type" value="dataset_zip">
                    <select name="target_name" class="form-select bg-dark text-light border-secondary mb-2">
                        <option value="">— 选择数据集 —</option>
                        {% for z in dataset_zips %}
                        <option value="{{ z }}">{{ z }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" name="action" value="delete" class="btn btn-outline-danger btn-sm" onclick="return confirm('删除该数据集 zip？')">删除zip</button>
                </form>
            </div>
        </div>
        <div class="card bg-dark border-secondary mb-3">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">训练通知（SMTP）</h3>
                <form action="{{ url_for('save_notify') }}" method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">接收邮箱</label>
                        <input type="email" name="email" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.email or '' }}" placeholder="your@qq.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SMTP 账户</label>
                        <input type="text" name="smtp_user" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.smtp_user or '' }}" placeholder="123456@qq.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SMTP 授权码</label>
                        <input type="password" name="smtp_pwd" class="form-control bg-dark text-light border-secondary"
                               value="" placeholder="留空则保持不变">
                        <small class="text-secondary">QQ邮箱 → 设置 → 账户 → 生成授权码</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SMTP 服务器</label>
                        <input type="text" name="smtp_host" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.smtp_host or 'smtp.qq.com' }}" placeholder="smtp.qq.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SMTP 端口（SSL）</label>
                        <input type="number" name="smtp_port" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.smtp_port or 465 }}" min="1" max="65535">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="email_notify" value="1" class="form-check-input" id="notifyCb"
                               {{ 'checked' if current_user.email_notify else '' }}>
                        <label class="form-check-label" for="notifyCb">训练完成时发送邮件通知</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">训练进度报告间隔（步数，0=关闭）</label>
                        <input type="number" name="report_interval" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.report_interval or 0 }}" min="0" max="100000" step="100">
                        <small class="text-secondary">每隔这么多步发一封训练进度邮件（需开启上方邮件通知）</small>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="infer_notify" value="1" class="form-check-input" id="inferNotifyCb"
                               {{ 'checked' if current_user.infer_notify else '' }}>
                        <label class="form-check-label" for="inferNotifyCb">推理完成时发送邮件通知</label>
                    </div>
                    <button type="submit" class="btn btn-outline-primary w-100 mb-2">保存通知设置</button>
                    <button type="submit" formaction="{{ url_for('test_notify') }}" formmethod="POST" class="btn btn-outline-info w-100">发送测试邮件</button>
                </form>
            </div>
        </div>

        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">账号设置</h3>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.username }}">
                    </div>

                    <hr class="border-secondary">
                    <h5>推理默认值</h5>
                    <div class="mb-3">
                        <label class="form-label">默认推理设备</label>
                        <select name="device_pref" class="form-select bg-dark text-light border-secondary">
                            <option value="auto" {{ 'selected' if current_user.device_pref in (None, 'auto') }}>自动检测</option>
                            <option value="cuda" {{ 'selected' if current_user.device_pref == 'cuda' }}>GPU (CUDA)</option>
                            <option value="cpu" {{ 'selected' if current_user.device_pref == 'cpu' }}>CPU</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">内存限制 (GB) <small class="text-danger">⚠ 仅测试用</small></label>
                        <input type="number" name="memory_limit" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.memory_limit or 0 }}" min="0" max="32" step="1">
                        <small class="text-secondary">子进程内存超过此值将被终止。0=不限制。此功能不稳定，仅供测试。</small>
                    </div>

                    <hr class="border-secondary">
                    <div class="mb-3">
                        <label class="form-label">当前密码 <span class="text-danger">*</span></label>
                        <input type="password" name="old_password" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码 <small class="text-secondary">（留空则不修改）</small></label>
                        <input type="password" name="new_password" class="form-control bg-dark text-light border-secondary" minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认新密码</label>
                        <input type="password" name="confirm_password" class="form-control bg-dark text-light border-secondary">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">保存</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
