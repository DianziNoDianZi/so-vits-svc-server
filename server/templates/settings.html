{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card bg-dark border-secondary mb-3">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">通知</h3>
                <p class="text-secondary small text-center mb-3">邮件由服务器统一 SMTP 发送，无需填写账号密码</p>
                <form action="{{ url_for('save_notify') }}" method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">接收邮箱</label>
                        <input type="email" name="email" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.email or '' }}" placeholder="your@qq.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">结果接收邮箱 <small class="text-secondary">（可留空=用上方邮箱）</small></label>
                        <input type="email" name="notify_email" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.notify_email or '' }}" placeholder="result@qq.com">
                        <small class="text-secondary">推理完成后，结果下载链接发到这个邮箱</small>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="infer_notify" value="1" class="form-check-input" id="inferNotifyCb"
                               {{ 'checked' if current_user.infer_notify else '' }}>
                        <label class="form-check-label" for="inferNotifyCb">推理完成时发送邮件通知</label>
                    </div>
                    <button type="submit" class="btn btn-outline-primary w-100 mb-2">保存通知设置</button>
                    <button type="submit" formaction="{{ url_for('test_notify') }}" formmethod="POST" class="btn btn-outline-info w-100">发送测试邮件</button>
                </form>
            </div>
        </div>

        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">账号设置</h3>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.username }}">
                    </div>

                    <hr class="border-secondary">
                    <div class="mb-3">
                        <label class="form-label">当前密码 <span class="text-danger">*</span></label>
                        <input type="password" name="old_password" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码 <small class="text-secondary">（留空则不修改）</small></label>
                        <input type="password" name="new_password" class="form-control bg-dark text-light border-secondary" minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认新密码</label>
                        <input type="password" name="confirm_password" class="form-control bg-dark text-light border-secondary">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">保存</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
