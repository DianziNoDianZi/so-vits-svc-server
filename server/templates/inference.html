{% extends "base.html" %}
{% block content %}
<style>
#loading-overlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 9999;
    justify-content: center; align-items: center;
    flex-direction: column;
}
#loading-overlay.active { display: flex; }
.spinner {
    border: 4px solid #30363d; border-top: 4px solid #58a6ff;
    border-radius: 50%; width: 48px; height: 48px;
    animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.hist-card { font-size: 12px; }
.hist-card .param-line { color: #9aa7cc; word-break: break-all; }
.hist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
</style>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p class="text-light mt-3" id="progress-msg">正在提交推理任务，请稍候...</p>
    <p class="text-secondary" id="elapsed">已耗时: 0s</p>
</div>

<script>
document.querySelector('form')?.addEventListener('submit', function() {
    document.getElementById('loading-overlay').classList.add('active');
    var start = Date.now();
    var timer = setInterval(function() {
        var s = Math.floor((Date.now() - start) / 1000);
        document.getElementById('elapsed').textContent = '已耗时: ' + s + 's';
    }, 500);
});

function fillParams(select) {
    var opt = select.options[select.selectedIndex];
    if (!opt || !opt.dataset.params) return;
    var p = JSON.parse(opt.dataset.params);
    function setv(name, val) {
        var el = document.querySelector('[name="' + name + '"]');
        if (!el) return;
        if (el.type === 'checkbox') { el.checked = !!val; }
        else { el.value = val === undefined || val === null ? '' : val; }
    }
    setv('f0_predictor', p.f0_predictor || 'rmvpe');
    setv('k_step', p.k_step !== undefined ? p.k_step : 100);
    setv('vc_transform', p.vc_transform !== undefined ? p.vc_transform : 0);
    setv('cluster_ratio', p.cluster_ratio !== undefined ? p.cluster_ratio : 0.2);
    setv('slice_db', p.slice_db !== undefined ? p.slice_db : -40);
    setv('noise_scale', p.noise_scale !== undefined ? p.noise_scale : 0.4);
    setv('pad_seconds', p.pad_seconds !== undefined ? p.pad_seconds : 0.5);
    setv('auto_f0', !!p.auto_f0);
    setv('enhancer', !!p.enhancer);
    setv('second_encoding', !!p.second_encoding);
    setv('loudness_envelope', p.loudness_envelope !== undefined ? p.loudness_envelope : 0);
    setv('output_format', p.output_format || 'wav');
    // 检索索引：无索引时不禁用输入框，后端会在推理时自动置 0
    var cr = document.querySelector('input[name="cluster_ratio"]');
    if (cr) { cr.disabled = false; }

    // 展示模型信息
    var panel = document.getElementById('modelInfoPanel');
    if (!opt.dataset.modelInfo || opt.dataset.modelInfo === 'null') {
        if (panel) panel.style.display = 'none';
        return;
    }
    var mi = JSON.parse(opt.dataset.modelInfo);
    if (!mi || !mi.arch) { if (panel) panel.style.display = 'none'; return; }
    if (panel) panel.style.display = 'block';
    var flowLabel = '';
    if (mi.flow_mode === 'a1') flowLabel = 'A1 特征先验流';
    else if (mi.flow_mode === 'a2') flowLabel = 'A2 后验流';
    else flowLabel = mi.flow_mode || '标准流';
    var archMap = {'rvc-flow': 'RVC-Flow', 'rvc': 'RVC', 'sovits-v1': 'SoVITS v1'};
    document.getElementById('mi-arch').textContent = archMap[mi.arch] || mi.arch;
    document.getElementById('mi-flow').textContent = flowLabel;
    document.getElementById('mi-step').textContent = mi.step ? ('Step ' + mi.step) : 'Step ?';
    document.getElementById('mi-unified').style.display = mi.use_unified_flow ? '' : 'none';
}
document.addEventListener('DOMContentLoaded', function() {
    var sel = document.querySelector('select[name="config_id"]');
    if (sel) {
        sel.addEventListener('change', function() { fillParams(this); });
        if (sel.value) fillParams(sel);
    }
});
</script>

<h2>推理</h2>

{% if not configs %}
<div class="card bg-dark border-secondary mt-3">
    <div class="card-body text-center py-5">
        <p class="text-secondary mb-3">请先上传模型并创建推理配置</p>
        <a href="{{ url_for('config_create') }}" class="btn btn-primary">创建配置</a>
    </div>
</div>
{% else %}
<div class="row mt-3 justify-content-center">
    <div class="col-md-8">
        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <h5 class="card-title">推理</h5>
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">推理配置（默认值）</label>
                        <select name="config_id" class="form-select bg-dark text-light border-secondary" required>
                            <option value="">— 选择配置 —</option>
                            {% for c in configs %}
                            <option value="{{ c.id }}" data-params='{{ c.params|tojson }}' data-has-cluster="{{ '1' if c.has_cluster else '0' }}" data-model-info='{{ c.model_info|tojson }}' data-model-id="{{ c.model_id }}">{{ c.name }} ({{ c.model }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div id="modelInfoPanel" class="mb-3" style="display:none;">
                        <div class="card card-body bg-dark border-secondary p-2" style="font-size:12px;">
                            <div class="d-flex flex-wrap gap-2 mb-1">
                                <span class="badge bg-info text-dark" id="mi-arch">arch</span>
                                <span class="badge bg-warning text-dark" id="mi-flow">flow</span>
                                <span class="badge bg-secondary" id="mi-step">step</span>
                                <span class="badge bg-success" id="mi-unified" style="display:none;">Unified Flow</span>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">音频文件</label>
                        <input type="file" name="audio_file" class="form-control bg-dark text-light border-secondary"
                               accept=".wav,.mp3,.flac,.m4a" required>
                    </div>

                    <div class="mb-2">
                        <a data-bs-toggle="collapse" href="#infAdvParams" role="button" class="text-secondary" style="font-size:13px;">⚙ 参数（默认使用所选配置的值，点开可临时覆盖）</a>
                    </div>
                    <div class="collapse" id="infAdvParams">
                        <div class="card card-body bg-dark border-secondary p-2 mb-3">
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">F0 预测器</label>
                                    <select name="f0_predictor" class="form-select form-select-sm bg-dark text-light border-secondary">
                                        <option value="rmvpe">rmvpe (推荐)</option>
                                        <option value="pm">pm (快速)</option>
                                        <option value="harvest">harvest</option>
                                        <option value="crepe">crepe (准但慢)</option>
                                        <option value="dio">dio</option>
                                        <option value="fcpe">fcpe</option>
                                    </select>
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">变调 (半音)</label>
                                    <input type="number" name="vc_transform" class="form-control form-control-sm bg-dark text-light border-secondary" value="0" min="-24" max="24">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">浅扩散 k_step</label>
                                    <input type="number" name="k_step" class="form-control form-control-sm bg-dark text-light border-secondary" value="100" min="0" max="1000">
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">噪声</label>
                                    <input type="number" name="noise_scale" class="form-control form-control-sm bg-dark text-light border-secondary" value="0.4" min="0" max="1" step="0.1">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">聚类比例</label>
                                    <input type="number" name="cluster_ratio" class="form-control form-control-sm bg-dark text-light border-secondary" value="0.2" min="0" max="1" step="0.1" title="需要模型挂载检索索引">
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">切片阈值 (dB)</label>
                                    <input type="number" name="slice_db" class="form-control form-control-sm bg-dark text-light border-secondary" value="-40" min="-60" max="0">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">Pad (秒)</label>
                                    <input type="number" name="pad_seconds" class="form-control form-control-sm bg-dark text-light border-secondary" value="0.5" min="0" max="5" step="0.1">
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">响度包络</label>
                                    <input type="number" name="loudness_envelope" class="form-control form-control-sm bg-dark text-light border-secondary" value="0" min="0" max="1" step="0.1">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-4 mb-2">
                                    <div class="form-check">
                                        <input type="checkbox" name="auto_f0" class="form-check-input" id="inf_auto_f0">
                                        <label class="form-check-label" for="inf_auto_f0" style="font-size:12px;">自动 F0</label>
                                    </div>
                                </div>
                                <div class="col-4 mb-2">
                                    <div class="form-check">
                                        <input type="checkbox" name="enhancer" class="form-check-input" id="inf_enhancer">
                                        <label class="form-check-label" for="inf_enhancer" style="font-size:12px;">NSF 增强</label>
                                    </div>
                                </div>
                                <div class="col-4 mb-2">
                                    <div class="form-check">
                                        <input type="checkbox" name="second_encoding" class="form-check-input" id="inf_second">
                                        <label class="form-check-label" for="inf_second" style="font-size:12px;">二次编码</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label class="form-label" style="font-size:13px;">输出格式</label>
                                    <select name="output_format" class="form-select form-select-sm bg-dark text-light border-secondary">
                                        <option value="wav">WAV</option>
                                        <option value="mp3">MP3</option>
                                        <option value="flac">FLAC</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">开始推理</button>
                    <small class="text-secondary d-block mt-2 text-center">参数基于所选配置默认值，可临时调整</small>
                </form>
            </div>
        </div>
    </div>
</div>
{% endif %}
{% endblock %}
