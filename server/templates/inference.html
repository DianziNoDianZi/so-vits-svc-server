{% extends "base.html" %}
{% block content %}
<style>
#loading-overlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 9999;
    justify-content: center; align-items: center;
    flex-direction: column;
}
#loading-overlay.active { display: flex; }
.spinner {
    border: 4px solid #30363d; border-top: 4px solid #58a6ff;
    border-radius: 50%; width: 48px; height: 48px;
    animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p class="text-light mt-3" id="progress-msg">正在提交推理任务，请稍候...</p>
    <p class="text-secondary" id="elapsed">已耗时: 0s</p>
</div>

<script>
document.querySelector('form')?.addEventListener('submit', function() {
    document.getElementById('loading-overlay').classList.add('active');
    var start = Date.now();
    var timer = setInterval(function() {
        var s = Math.floor((Date.now() - start) / 1000);
        document.getElementById('elapsed').textContent = '已耗时: ' + s + 's';
    }, 500);
    /* 提交后跳转到任务列表页查看实时进度 */
});
</script>

<h2>推理</h2>

{% if not configs %}
<div class="card bg-dark border-secondary mt-3">
    <div class="card-body text-center py-5">
        <p class="text-secondary mb-3">请先上传模型并创建推理配置</p>
        <a href="{{ url_for('config_create') }}" class="btn btn-primary">创建配置</a>
    </div>
</div>
{% else %}
<div class="row mt-3">
    <div class="col-md-5">
        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <h5 class="card-title">推理设置</h5>
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">推理配置</label>
                        <select name="config_id" class="form-select bg-dark text-light border-secondary" required>
                            <option value="">— 选择配置 —</option>
                            {% for c in configs %}
                            <option value="{{ c.id }}">{{ c.name }} ({{ c.model.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">音频文件</label>
                        <input type="file" name="audio_file" class="form-control bg-dark text-light border-secondary"
                               accept=".wav,.mp3,.flac,.m4a" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">开始推理</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <h5 class="card-title">结果</h5>
                {% if result_file %}
                <div class="text-center py-4">
                    <p class="text-success mb-3">✅ 推理完成</p>
                    <audio controls class="w-100 mb-3">
                        <source src="{{ url_for('download_result', filename=result_file) }}">
                    </audio>
                    <br>
                    <a href="{{ url_for('download_result', filename=result_file) }}" class="btn btn-success">
                        ⬇ 下载文件
                    </a>
                </div>
                {% else %}
                <p class="text-secondary text-center py-4">选择配置和音频文件后开始推理</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endif %}
{% endblock %}
