{% extends "base.html" %}
{% block content %}
<script>
    function syncClusterRatio() {
        var sel = document.querySelector('select[name="model_id"]');
        var input = document.querySelector('input[name="cluster_ratio"]');
        var hint = document.getElementById('clusterHint');
        if (!sel || !input) return;
        var opt = sel.options[sel.selectedIndex];
        var has = opt ? opt.getAttribute('data-has-cluster') === '1' : false;
        input.disabled = false;
        if (hint) {
            if (has) {
                hint.textContent = '需要模型挂载检索索引（训练完成自动生成）';
                hint.className = 'text-secondary';
            } else {
                hint.textContent = '当前模型未挂载检索索引，推理时将自动忽略聚类比例';
                hint.className = 'text-warning';
            }
        }
    }
    document.addEventListener('DOMContentLoaded', function () {
        var sel = document.querySelector('select[name="model_id"]');
        if (sel) sel.addEventListener('change', syncClusterRatio);
        syncClusterRatio();
    });
</script>
<h2>{{ '编辑配置' if config else '创建配置' }}</h2>
<div class="card bg-dark border-secondary mt-3">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">配置名称</label>
                <input type="text" name="name" class="form-control bg-dark text-light border-secondary"
                       value="{{ config.name if config else '' }}" required>
            </div>
            {% if not config %}
            <div class="mb-3">
                <label class="form-label">关联模型</label>
                <select name="model_id" class="form-select bg-dark text-light border-secondary" required>
                    <option value="">— 选择模型 —</option>
                    {% for m in models %}
                    <option value="{{ m.id }}" data-has-cluster="{{ '1' if m.cluster_path else '0' }}">{{ m.name }}{{ '（含检索索引）' if m.cluster_path }}</option>
                    {% endfor %}
                </select>
            </div>
            {% else %}
            <div class="mb-3">
                <label class="form-label">关联模型</label>
                <select name="model_id" class="form-select bg-dark text-light border-secondary">
                    {% for m in models %}
                    <option value="{{ m.id }}" data-has-cluster="{{ '1' if m.cluster_path else '0' }}" {{ 'selected' if m.id == config.model_id }}>{{ m.name }}{{ '（含检索索引）' if m.cluster_path }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <hr class="border-secondary">
            <h5>推理参数</h5>
            <div class="row mt-3">

            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">F0 预测器</label>
                    <select name="f0_predictor" class="form-select bg-dark text-light border-secondary">
                        <option value="pm" {{ 'selected' if params.get('f0_predictor') == 'pm' }}>pm (快速)</option>
                        <option value="rmvpe" {{ 'selected' if params.get('f0_predictor') == 'rmvpe' }}>rmvpe (推荐)</option>
                        <option value="crepe" {{ 'selected' if params.get('f0_predictor') == 'crepe' }}>crepe (准确但慢)</option>
                        <option value="dio" {{ 'selected' if params.get('f0_predictor') == 'dio' }}>dio</option>
                        <option value="harvest" {{ 'selected' if params.get('f0_predictor') == 'harvest' }}>harvest</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">浅扩散步数 (k_step)</label>
                    <input type="number" name="k_step" class="form-control bg-dark text-light border-secondary"
                           value="{{ params.get('k_step', 100) }}" min="0" max="1000">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">变调 (半音)</label>
                    <input type="number" name="vc_transform" class="form-control bg-dark text-light border-secondary"
                           value="{{ params.get('vc_transform', 0) }}" min="-24" max="24">
                </div>
            </div>
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label class="form-label">聚类比例</label>
                    <input type="number" name="cluster_ratio" class="form-control bg-dark text-light border-secondary"
                           value="{{ params.get('cluster_ratio', 0) }}" min="0" max="1" step="0.1">
                    <small class="text-secondary" id="clusterHint">需要模型挂载检索索引（训练完成自动生成）</small>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">切片阈值 (dB)</label>
                    <input type="number" name="slice_db" class="form-control bg-dark text-light border-secondary"
                           value="{{ params.get('slice_db', -40) }}" min="-60" max="0">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">噪声</label>
                    <input type="number" name="noise_scale" class="form-control bg-dark text-light border-secondary"
                           value="{{ params.get('noise_scale', 0.4) }}" min="0" max="1" step="0.1">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Pad (秒)</label>
                    <input type="number" name="pad_seconds" class="form-control bg-dark text-light border-secondary"
                           value="{{ params.get('pad_seconds', 0.5) }}" min="0" max="5" step="0.1">
                </div>
            </div>
            <div class="row">
                <div class="col-md-3 mb-3">
                    <div class="form-check mt-4">
                        <input type="checkbox" name="auto_f0" class="form-check-input" id="auto_f0"
                               {{ 'checked' if params.get('auto_f0') }}>
                        <label class="form-check-label" for="auto_f0">自动 F0</label>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="form-check mt-4">
                        <input type="checkbox" name="enhancer" class="form-check-input" id="enhancer"
                               {{ 'checked' if params.get('enhancer') }}>
                        <label class="form-check-label" for="enhancer">NSF 增强</label>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="form-check mt-4">
                        <input type="checkbox" name="second_encoding" class="form-check-input" id="second_encoding"
                               {{ 'checked' if params.get('second_encoding') }}>
                        <label class="form-check-label" for="second_encoding">二次编码</label>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">输出格式</label>
                    <select name="output_format" class="form-select bg-dark text-light border-secondary">
                        <option value="wav" {{ 'selected' if params.get('output_format') == 'wav' }}>WAV</option>
                        <option value="mp3" {{ 'selected' if params.get('output_format') == 'mp3' }}>MP3</option>
                        <option value="flac" {{ 'selected' if params.get('output_format') == 'flac' }}>FLAC</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Flow 推理模式</label>
                    <select name="hybrid_mode" class="form-select bg-dark text-light border-secondary">
                        <option value="auto" {{ 'selected' if params.get('hybrid_mode', 'auto') == 'auto' }}>auto (自动)</option>
                        <option value="nf" {{ 'selected' if params.get('hybrid_mode') == 'nf' }}>nf (纯 NF，最快)</option>
                        <option value="hybrid" {{ 'selected' if params.get('hybrid_mode') == 'hybrid' }}>hybrid (NF+FM 精修，推荐)</option>
                        <option value="fm" {{ 'selected' if params.get('hybrid_mode') == 'fm' }}>fm (纯 FM 32 步，最慢)</option>
                    </select>
                    <small class="text-secondary">仅方案3统一流模型生效；非统一流模型固定走 nf</small>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">{{ '保存' if config else '创建' }}</button>
            <a href="{{ url_for('config_list') }}" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>
{% endblock %}
