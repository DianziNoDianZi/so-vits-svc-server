{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2 class="mb-0">邮件模板</h2>
    <a href="{{ url_for('admin_settings') }}" class="btn btn-sm btn-outline-secondary">返回设置</a>
</div>
<p class="text-secondary small mt-2">自定义各类邮件的标题与正文。用 <code>{占位符}</code> 插入动态内容，未提供的占位符会原样保留。</p>

<form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    {% for key, t in templates.items() %}
    <div class="card bg-dark border-secondary mt-3">
        <div class="card-body">
            <h5 class="card-title">{{ t.label }}</h5>
            <div class="mb-2">
                <label class="form-label small">标题</label>
                <input type="text" name="{{ key }}_subject" class="form-control form-control-sm bg-dark text-light border-secondary" value="{{ t.subject }}">
            </div>
            <div class="mb-1">
                <label class="form-label small">正文</label>
                <textarea name="{{ key }}_body" rows="6" class="form-control bg-dark text-light border-secondary">{{ t.body }}</textarea>
            </div>
            <small class="text-secondary">可用占位符：{{ t.hint }}</small>
        </div>
    </div>
    {% endfor %}
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">保存所有模板</button>
        <span class="text-secondary small ms-2">留空 = 使用默认模板</span>
    </div>
</form>
{% endblock %}
