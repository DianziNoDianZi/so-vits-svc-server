{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <h3 class="card-title text-center mb-2">首次设置</h3>
                <p class="text-center text-secondary mb-4">请修改默认密码，可选修改用户名</p>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary"
                               value="{{ current_user.username }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">当前密码</label>
                        <input type="password" name="old_password" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input type="password" name="new_password" class="form-control bg-dark text-light border-secondary" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认新密码</label>
                        <input type="password" name="confirm_password" class="form-control bg-dark text-light border-secondary" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">保存</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
