{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card bg-dark border-secondary">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">注册</h3>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary" value="{{ username or '' }}" required minlength="2">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">邮箱 <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control bg-dark text-light border-secondary" value="{{ email or '' }}" required>
                        <small class="text-secondary">用于账号与登录邮箱</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">结果接收邮箱 <small class="text-secondary">（可留空=用上方邮箱）</small></label>
                        <input type="email" name="notify_email" class="form-control bg-dark text-light border-secondary" value="{{ notify_email or '' }}">
                        <small class="text-secondary">推理完成后，结果下载链接会发到这个邮箱</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认密码</label>
                        <input type="password" name="confirm_password" class="form-control bg-dark text-light border-secondary" required minlength="6">
                    </div>
                    {% if invite_mode and invite_mode != 'off' %}
                    <div class="mb-3">
                        <label class="form-label">邀请码 {% if invite_mode == 'required' %}<span class="text-danger">*</span>{% else %}<small class="text-secondary">（选填）</small>{% endif %}</label>
                        <input type="text" name="invite_code" class="form-control bg-dark text-light border-secondary" {% if invite_mode == 'required' %}required{% endif %}>
                        {% if invite_mode == 'required' %}<small class="text-warning">本服务需邀请码才能注册</small>{% endif %}
                    </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100">注册</button>
                </form>
                <p class="text-center text-secondary mt-3 mb-0">
                    <small>已有账号？<a href="{{ url_for('login') }}" class="text-info">去登录</a></small>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
